<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termin- und NotizApp für Oma</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            flex: 1;
            transition: background-color 0.3s;
        }
        button:active {
            background-color: #3367D6;
        }
        button.recording {
            background-color: #EA4335;
            animation: pulse 1.5s infinite;
        }
        button.todo-btn {
            background-color: #34A853;
        }
        button.todo-btn:active {
            background-color: #2b8c44;
        }
        .login-btn {
            background-color: #fbbc05;
            color: #333;
            font-weight: bold;
            margin-bottom: 15px;
            width: 100%;
        }
        .refresh-btn {
            background-color: #6c757d;
            font-size: 14px;
            padding: 8px 15px;
            border-radius: 20px;
            flex: none;
            width: auto;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 67, 53, 0.4); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(234, 67, 53, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 67, 53, 0); }
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #555;
            word-break: break-word;
            font-size: 14px;
        }
        .section-box {
            margin-top: 25px;
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .section-box h3 {
            font-size: 16px;
            margin: 0;
            color: #444;
        }
        .event-item {
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
            border-left: 4px solid #4285F4;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .event-item:hover {
            background: #e9ecef;
            transform: translateX(2px);
        }
        .todo-item {
            background: #f1f8f5;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
            border-left: 4px solid #34A853;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .todo-item.completed span {
            text-decoration: line-through;
            color: #888;
        }
        .todo-item.completed {
            background: #f8f9fa;
            border-left-color: #ccc;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #cc0000;
            font-size: 16px;
            cursor: pointer;
            padding: 0 5px;
            box-shadow: none;
            flex: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Omas Sprach-Assistent</h1>
        
        <!-- Manueller Login-Button falls es klemmt -->
        <button id="loginBtn" class="login-btn" onclick="triggerLogin()" style="display:none;">🔐 Bei Google anmelden</button>

        <p>Wähle aus, was du eintragen möchtest:</p>
        
        <div class="btn-group">
            <button id="micEventBtn" onclick="startSpeechRecognition('event')">🎤 Termin</button>
            <button id="micTodoBtn" class="todo-btn" onclick="startSpeechRecognition('todo')">🗣️ Notiz / To-Do</button>
        </div>
        
        <div id="status">Warte auf Anmeldung...</div>

        <div class="section-box">
            <div class="section-header">
                <h3>Nächste Termine:</h3>
                <button class="refresh-btn" onclick="fetchUpcomingEvents()">🔄 Laden</button>
            </div>
            <div id="eventsContainer">Noch nicht geladen.</div>
            <div style="font-size: 11px; color: #777; margin-top: 5px; text-align: center;">💡 Klick auf Termin öffnet den Google Kalender</div>
        </div>

        <div class="section-box">
            <h3>Merkliste / To-Dos (Klick zum Abhaken):</h3>
            <div id="todosContainer">Noch keine Notizen vorhanden.</div>
        </div>
    </div>

    <!-- Google GIS (Google Identity Services) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        const CLIENT_ID = '399573320370-qka01ghj0s88eoair7lla665cbj10o4g.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/calendar.events';
        
        let tokenClient;
        let accessToken = null;
        let todos = JSON.parse(localStorage.getItem('omas_todos') || '[]');

        window.onload = function () {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (response) => {
                    if (response.error !== undefined) {
                        document.getElementById('status').innerText = 'Fehler bei Anmeldung: ' + response.error;
                        document.getElementById('loginBtn').style.display = 'block';
                        return;
                    }
                    accessToken = response.access_token;
                    document.getElementById('loginBtn').style.display = 'none';
                    document.getElementById('status').innerText = 'Angemeldet! Lade Termine...';
                    fetchUpcomingEvents();
                },
            });

            // Automatischer Login-Versuch beim Start
            try {
                tokenClient.requestAccessToken({ prompt: '' });
            } catch (e) {
                document.getElementById('loginBtn').style.display = 'block';
                document.getElementById('status').innerText = 'Bitte bei Google anmelden.';
            }

            renderTodos();
        };

        function triggerLogin() {
            if (tokenClient) {
                tokenClient.requestAccessToken({ prompt: 'consent' });
            }
        }

        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("Audio Context blockiert", e);
            }
        }

        function startSpeechRecognition(mode) {
            if (mode === 'event' && !accessToken) {
                alert('Bitte zuerst bei Google anmelden!');
                triggerLogin();
                return;
            }
            listenAndProcess(mode);
        }

        function fetchUpcomingEvents() {
            if (!accessToken) {
                document.getElementById('eventsContainer').innerHTML = 'Nicht angemeldet.';
                document.getElementById('loginBtn').style.display = 'block';
                return;
            }

            document.getElementById('status').innerText = 'Lade Termine...';

            const now = new Date().toISOString();
            fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${now}&maxResults=30&singleEvents=true&orderBy=startTime`, {
                headers: {
                    'Authorization': 'Bearer ' + accessToken
                }
            })
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('eventsContainer');
                container.innerHTML = '';

                if (!data.items || data.items.length === 0) {
                    container.innerHTML = 'Keine anstehenden Termine gefunden.';
                    document.getElementById('status').innerText = 'Bereit...';
                    return;
                }

                const timedEvents = data.items.filter(item => item.start && item.start.dateTime);

                if (timedEvents.length === 0) {
                    container.innerHTML = 'Keine anstehenden Uhrzeit-Termine gefunden.';
                    document.getElementById('status').innerText = 'Bereit...';
                    return;
                }

                timedEvents.slice(0, 5).forEach((item, index) => {
                    const startDate = new Date(item.start.dateTime);
                    const formattedDate = startDate.toLocaleDateString('de-DE', {weekday: 'short', day: '2-digit', month: '2-digit'});
                    const formattedTime = startDate.toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'}) + ' Uhr';
                    
                    const div = document.createElement('div');
                    div.className = 'event-item';
                    div.innerText = `${index + 1}. ${item.summary} (${formattedDate}, ${formattedTime})`;
                    
                    div.onclick = function() {
                        const calendarUrl = item.htmlLink || 'https://calendar.google.com/';
                        window.open(calendarUrl, '_blank');
                    };

                    container.appendChild(div);
                });
                document.getElementById('status').innerText = 'Bereit...';
            })
            .catch(err => {
                console.error(err);
                document.getElementById('eventsContainer').innerHTML = 'Fehler beim Laden.';
                document.getElementById('status').innerText = 'Fehler beim Abrufen.';
            });
        }

        function listenAndProcess(mode) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Spracherkennung wird von diesem Browser leider nicht unterstützt.');
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            
            const btn = mode === 'event' ? document.getElementById('micEventBtn') : document.getElementById('micTodoBtn');

            recognition.onstart = function() {
                playBeep();
                btn.classList.add('recording');
                btn.innerText = '🔴 Höre zu...';
                document.getElementById('status').innerText = '🎙️ Sprich jetzt...';
            };

            recognition.onresult = function(event) {
                const speechText = event.results[0][0].transcript;
                
                if (mode === 'event') {
                    document.getElementById('status').innerText = 'Erkannt: "' + speechText + '" - Trage Termin ein...';
                    parseAndCreateEvent(speechText);
                } else {
                    document.getElementById('status').innerText = 'Notiz hinzugefügt: "' + speechText + '"';
                    addTodo(speechText);
                }
            };

            recognition.onerror = function(event) {
                document.getElementById('status').innerText = 'Sprachfehler: ' + event.error;
                resetButtons();
            };

            recognition.onend = function() {
                resetButtons();
            };

            recognition.start();
        }

        function resetButtons() {
            const btnEvent = document.getElementById('micEventBtn');
            const btnTodo = document.getElementById('micTodoBtn');
            btnEvent.classList.remove('recording');
            btnEvent.innerText = '🎤 Termin';
            btnTodo.classList.remove('recording');
            btnTodo.innerText = '🗣️ Notiz / To-Do';
        }

        function addTodo(text) {
            todos.unshift({ text: text, completed: false });
            saveAndRenderTodos();
        }

        function toggleTodo(index) {
            todos[index].completed = !todos[index].completed;
            saveAndRenderTodos();
        }

        function deleteTodo(event, index) {
            event.stopPropagation();
            todos.splice(index, 1);
            saveAndRenderTodos();
        }

        function saveAndRenderTodos() {
            localStorage.setItem('omas_todos', JSON.stringify(todos));
            renderTodos();
        }

        function renderTodos() {
            const container = document.getElementById('todosContainer');
            container.innerHTML = '';

            if (todos.length === 0) {
                container.innerHTML = '<div style="color: #777; font-size: 14px; text-align: center; padding: 5px;">Noch keine Notizen vorhanden.</div>';
                return;
            }

            todos.forEach((todo, index) => {
                const div = document.createElement('div');
                div.className = 'todo-item' + (todo.completed ? ' completed' : '');
                
                const span = document.createElement('span');
                span.innerText = todo.text;
                
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '🗑️';
                delBtn.onclick = (e) => deleteTodo(e, index);

                div.appendChild(span);
                div.appendChild(delBtn);
                div.onclick = () => toggleTodo(index);

                container.appendChild(div);
            });
        }

        function parseAndCreateEvent(text) {
            let eventDate = new Date();
            let hours = 10; 
            let minutes = 0;

            const lowerText = text.toLowerCase();

            if (lowerText.includes('morgen')) {
                eventDate.setDate(eventDate.getDate() + 1);
            }

            const timeMatch = text.match(/(?:um\s+)?(\d{1,2})(?::(\d{2}))?\s*uhr/i);
            if (timeMatch) {
                hours = parseInt(timeMatch[1], 10);
                if (timeMatch[2]) {
                    minutes = parseInt(timeMatch[2], 10);
                }
            } else {
                const altMatch = text.match(/(\d{1,2}):(\d{2})/);
                if (altMatch) {
                    hours = parseInt(altMatch[1], 10);
                    minutes = parseInt(altMatch[2], 10);
                }
            }

            let eventTitle = text
                .replace(/heute|morgen/gi, '')
                .replace(/(?:um\s+)?\d{1,2}(?::\d{2})?\s*uhr/gi, '')
                .replace(/erinnere mich.*$/i, '')
                .replace(/sag mir.*$/i, '')
                .replace(/\d+\s*(?:stunden?|minuten?).*$/i, '')
                .trim();

            if (!eventTitle) {
                eventTitle = "Termin";
            }

            eventDate.setHours(hours, minutes, 0, 0);
            let endDate = new Date(eventDate.getTime() + 60 * 60 * 1000);

            function toLocalISOString(date) {
                const pad = (n) => String(n).padStart(2, '0');
                const yyyy = date.getFullYear();
                const MM = pad(date.getMonth() + 1);
                const dd = pad(date.getDate());
                const hh = pad(date.getHours());
                const mm = pad(date.getMinutes());
                const ss = pad(date.getSeconds());
                
                const offsetMinutes = -date.getTimezoneOffset();
                const sign = offsetMinutes >= 0 ? '+' : '-';
                const absOffsetHours = pad(Math.floor(Math.abs(offsetMinutes) / 60));
                const absOffsetMins = pad(Math.abs(offsetMinutes) % 60);

                return `${yyyy}-${MM}-${dd}T${hh}:${mm}:${ss}${sign}${absOffsetHours}:${absOffsetMins}`;
            }

            const calendarEvent = {
                'summary': eventTitle,
                'description': 'Erstellt über Omas Sprach-Assistent',
                'start': {
                    'dateTime': toLocalISOString(eventDate)
                },
                'end': {
                    'dateTime': toLocalISOString(endDate)
                }
            };

            fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + accessToken,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(calendarEvent)
            })
            .then(async response => {
                if (response.ok) {
                    document.getElementById('status').innerText = '✅ Termin erfolgreich eingetragen!';
                    fetchUpcomingEvents();
                } else {
                    const errData = await response.json();
                    console.error(errData);
                    document.getElementById('status').innerText = '❌ Fehler: ' + (errData.error?.message || response.statusText);
                }
            })
            .catch(error => {
                document.getElementById('status').innerText = '❌ Netzwerkfehler: ' + error.message;
            });
        }
    </script>
</body>
</html>
