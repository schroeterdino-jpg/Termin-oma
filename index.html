<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termin-Assistent</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 30px;
            text-align: center;
            margin-top: 20px;
        }
        h1 {
            font-size: 26px;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p.subtitle {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .auth-box {
            margin-bottom: 20px;
        }
        .btn-google {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(66, 133, 244, 0.3);
        }
        .btn-google:hover {
            background-color: #3367D6;
        }
        .status-badge {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .status-disconnected {
            background-color: #fadbd8;
            color: #c0392b;
        }
        .status-connected {
            background-color: #d4efdf;
            color: #27ae60;
        }
        .app-content {
            display: none;
        }
        .mic-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background-color: #e74c3c;
            color: white;
            border: none;
            font-size: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px auto;
            transition: transform 0.1s, background-color 0.2s;
        }
        .mic-btn:active {
            transform: scale(0.95);
        }
        .mic-btn.recording {
            background-color: #27ae60;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.6); }
            70% { box-shadow: 0 0 0 25px rgba(39, 174, 96, 0); }
            100% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0); }
        }
        .instructions {
            font-size: 18px;
            color: #34495e;
            margin-bottom: 20px;
            font-weight: bold;
        }
        textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            font-size: 16px;
            resize: none;
            margin-bottom: 15px;
        }
        textarea:focus {
            border-color: #3498db;
            outline: none;
        }
        .btn-save {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
        }
        .btn-save:hover {
            background-color: #27ae60;
        }
        #feedback {
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
        }
        .success {
            background-color: #e8f8f5;
            color: #16a085;
        }
        .error {
            background-color: #fadbd8;
            color: #c0392b;
        }
        .config-box {
            margin-top: 30px;
            text-align: left;
            border-top: 1px solid #ecf0f1;
            padding-top: 15px;
        }
        .config-box label {
            font-size: 12px;
            color: #7f8c8d;
            display: block;
            margin-bottom: 5px;
        }
        .config-box input {
            width: 100%;
            padding: 8px;
            font-size: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Termin-Assistent</h1>
        <p class="subtitle">Einfach sprechen oder schreiben – der Termin landet sofort im Kalender.</p>

        <!-- Google Konfiguration (Client ID) -->
        <div class="config-box">
            <label for="clientIdInput">Google Client ID (einmalig eintragen):</label>
            <input type="text" id="clientIdInput" placeholder="Deine Google OAuth Client ID hier einfügen...">
            <button onclick="saveClientId()" style="padding: 5px 10px; font-size: 12px; background: #34495e; color: white; border: none; border-radius: 4px; cursor: pointer;">Speichern</button>
        </div>

        <div style="margin-top: 20px;">
            <div id="statusBadge" class="status-badge status-disconnected">Nicht mit Google verbunden</div>
        </div>

        <!-- Login Bereich -->
        <div id="authSection" class="auth-box">
            <button class="btn-google" onclick="handleAuthClick()">Mit Google anmelden</button>
        </div>

        <!-- Haupt-App (nach Login aktiv) -->
        <div id="appSection" class="app-content">
            <div class="instructions">Drücken und sprechen:</div>
            <button id="micBtn" class="mic-btn" onclick="toggleListening()">🎤</button>
            
            <textarea id="termTextInput" placeholder="Oder hier tippen: z.B. Morgen um 15 Uhr Zahnarzt"></textarea>
            <button class="btn-save" onclick="processAndSaveAppointment()">Termin eintragen</button>

            <div id="feedback"></div>
        </div>
    </div>

    <script>
        let tokenClient;
        let accessToken = null;
        let recognition = null;
        let isRecording = false;

        window.onload = function() {
            const savedClientId = localStorage.getItem('google_client_id');
            if (savedClientId) {
                document.getElementById('clientIdInput').value = savedClientId;
                initGoogleClient(savedClientId);
            }
        };

        function saveClientId() {
            const clientId = document.getElementById('clientIdInput').value.trim();
            if (!clientId) {
                alert('Bitte gib eine gültige Client ID ein.');
                return;
            }
            localStorage.setItem('google_client_id', clientId);
            initGoogleClient(clientId);
            alert('Client ID gespeichert! Du kannst dich jetzt anmelden.');
        }

        function initGoogleClient(clientId) {
            if (!clientId) return;
            try {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: clientId,
                    scope: 'https://www.googleapis.com/auth/calendar.events',
                    callback: (response) => {
                        if (response.error) {
                            console.error(response);
                            showFeedback('Fehler bei der Anmeldung: ' + response.error, 'error');
                            return;
                        }
                        accessToken = response.access_token;
                        setConnectedState(true);
                        showFeedback('Erfolgreich mit Google Kalender verbunden!', 'success');
                    },
                });
            } catch (e) {
                console.error("Fehler beim Initialisieren von Google GIS:", e);
            }
        }

        function handleAuthClick() {
            const clientId = document.getElementById('clientIdInput').value.trim();
            if (!clientId) {
                alert('Bitte trage zuerst deine Google Client ID im Feld unten ein!');
                return;
            }
            if (!tokenClient) {
                initGoogleClient(clientId);
            }
            if (tokenClient) {
                tokenClient.requestAccessToken({ prompt: 'consent' });
            }
        }

        function setConnectedState(isConnected) {
            const badge = document.getElementById('statusBadge');
            const authSec = document.getElementById('authSection');
            const appSec = document.getElementById('appSection');

            if (isConnected) {
                badge.className = 'status-badge status-connected';
                badge.innerText = 'Verbunden mit Google Kalender';
                authSec.style.display = 'none';
                appSec.style.display = 'block';
            } else {
                badge.className = 'status-badge status-disconnected';
                badge.innerText = 'Nicht mit Google verbunden';
                authSec.style.display = 'block';
                appSec.style.display = 'none';
            }
        }

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                const speechText = event.results[0][0].transcript;
                document.getElementById('termTextInput').value = speechText;
                stopListeningVisual();
                processAndSaveAppointment();
            };

            recognition.onerror = function(event) {
                console.error("Sprachfehler:", event.error);
                stopListeningVisual();
                showFeedback('Spracherkennung fehlgeschlagen. Bitte tippen.', 'error');
            };

            recognition.onend = function() {
                stopListeningVisual();
            };
        }

        function toggleListening() {
            if (!recognition) {
                alert('Dein Browser unterstützt keine Spracherkennung. Bitte nutze Chrome und tippe den Text stattdessen ein.');
                return;
            }
            if (isRecording) {
                recognition.stop();
                stopListeningVisual();
            } else {
                try {
                    recognition.start();
                    startListeningVisual();
                } catch (e) {
                    console.error(e);
                }
            }
        }

        function startListeningVisual() {
            isRecording = true;
            const btn = document.getElementById('micBtn');
            btn.classList.add('recording');
            btn.innerText = '🛑';
            showFeedback('Höre zu... Bitte sprich jetzt.', 'success');
        }

        function stopListeningVisual() {
            isRecording = false;
            const btn = document.getElementById('micBtn');
            btn.classList.remove('recording');
            btn.innerText = '🎤';
        }

        function parseAppointmentText(text) {
            text = text.trim();
            let now = new Date();
            let targetDate = new Date();
            let title = text;
            let timeStr = "10:00";

            let lower = text.toLowerCase();

            if (lower.includes('übermorgen')) {
                targetDate.setDate(now.getDate() + 2);
                title = title.replace(/übermorgen/gi, '');
            } else if (lower.includes('morgen')) {
                targetDate.setDate(now.getDate() + 1);
                title = title.replace(/morgen/gi, '');
            } else if (lower.includes('heute')) {
                title = title.replace(/heute/gi, '');
            }

            const days = ['sonntag', 'montag', 'dienstag', 'mittwoch', 'donnerstag', 'freitag', 'samstag'];
            days.forEach((day, index) => {
                if (lower.includes(day)) {
                    let currentDay = now.getDay();
                    let targetDay = index;
                    let diff = targetDay - currentDay;
                    if (diff <= 0) diff += 7;
                    targetDate.setDate(now.getDate() + diff);
                    title = title.replace(new RegExp(day, 'gi'), '');
                }
            });

            const timeMatch = text.match(/(?:um\s+)?(\d{1,2})(?::(\d{2}))?\s*(?:uhr)?/i);
            if (timeMatch) {
                let hours = timeMatch[1].padStart(2, '0');
                let minutes = timeMatch[2] ? timeMatch[2] : '00';
                timeStr = `${hours}:${minutes}`;
                title = title.replace(timeMatch[0], '');
            }

            title = title.replace(/um/gi, '').replace(/am/gi, '').replace(/\s+/g, ' ').trim();
            if (!title) title = "Termin";

            let year = targetDate.getFullYear();
            let month = String(targetDate.getMonth() + 1).padStart(2, '0');
            let dayStr = String(targetDate.getDate()).padStart(2, '0');
            let dateFormatted = `${year}-${month}-${dayStr}`;

            return {
                title: title,
                date: dateFormatted,
                time: timeStr
            };
        }

        async function processAndSaveAppointment() {
            const textInput = document.getElementById('termTextInput').value.trim();
            if (!textInput) {
                alert('Bitte sprich oder schreibe zuerst einen Termin.');
                return;
            }

            if (!accessToken) {
                alert('Nicht mit Google verbunden. Bitte zuerst anmelden.');
                setConnectedState(false);
                return;
            }

            showFeedback('Trage Termin ein...', 'success');

            const parsed = parseAppointmentText(textInput);
            const startDateTime = `${parsed.date}T${parsed.time}:00`;
            
            let [h, m] = parsed.time.split(':').map(Number);
            h = (h + 1) % 24;
            const endDateTime = `${parsed.date}T${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:00`;

            const eventData = {
                summary: parsed.title,
                description: "Automatisch erstellt per Sprach-Assistent",
                start: {
                    dateTime: startDateTime,
                    timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
                },
                end: {
                    dateTime: endDateTime,
                    timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
                },
                reminders: {
                    useDefault: false,
                    overrides: [
                        { method: 'popup', minutes: 60 },
                        { method: 'popup', minutes: 30 }
                    ]
                }
            };

            try {
                const response = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(eventData)
                });

                if (response.ok) {
                    showFeedback(`✅ Erfolgreich eingetragen: "${parsed.title}" am ${parsed.date} um ${parsed.time} Uhr!`, 'success');
                    document.getElementById('termTextInput').value = '';
                } else {
                    const errJson = await response.json();
                    console.error(errJson);
                    if (response.status === 401) {
                        showFeedback('Sitzung abgelaufen. Bitte neu anmelden.', 'error');
                        setConnectedState(false);
                    } else {
                        showFeedback('Fehler beim Eintragen: ' + (errJson.error?.message || 'Unbekannt'), 'error');
                    }
                }
            } catch (err) {
                console.error(err);
                showFeedback('Netzwerkfehler beim Speichern.', 'error');
            }
        }

        function showFeedback(msg, type) {
            const fb = document.getElementById('feedback');
            fb.innerText = msg;
            fb.className = type;
        }
    </script>
</body>
</html>
