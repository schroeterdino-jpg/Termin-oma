<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminoma Kalender-Assistent</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
        }
        button {
            background-color: #bb86fc;
            color: #121212;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:active {
            background-color: #9965f4;
        }
        #output {
            margin-top: 20px;
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Terminoma Assistent</h1>
        <button id="recordBtn">Sprachaufnahme starten</button>
        <div id="output">Bereit für deine Eingabe...</div>
    </div>

    <script>
        const recordBtn = document.getElementById('recordBtn');
        const output = document.getElementById('output');

        // Überprüfung auf Spracherkennung
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            output.textContent = "Spracherkennung wird von diesem Browser leider nicht unterstützt.";
            recordBtn.disabled = true;
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recordBtn.addEventListener('click', () => {
                try {
                    recognition.start();
                    output.textContent = "Höre zu...";
                } catch (e) {
                    console.error(e);
                }
            });

            recognition.onresult = (event) => {
                const speechResult = event.results[0][0].transcript;
                output.textContent = "Erkannt: " + speechResult;
                processTextCommand(speechResult);
            };

            recognition.onerror = (event) => {
                output.textContent = "Fehler bei der Spracherkennung: " + event.error;
            };
        }

        // Felsenfester Parser & smarte Benachrichtigungslogik
        function parseTargetDate(txt, parsedIso) {
            let targetDate = new Date(); 
            const lower = txt.toLowerCase();
            
            if (lower.includes("morgen")) {
                targetDate.setDate(targetDate.getDate() + 1);
            }
            
            let foundHour = null;
            let foundMinute = 0;

            const matchColon = txt.match(/(\d{1,2}):(\d{2})/);
            const matchUhrMinute = txt.match(/(\d{1,2})\s*uhr\s*(\d{1,2})/i);
            const matchUhrSimple = txt.match(/(\d{1,2})\s*uhr/i);

            if (matchColon) {
                foundHour = parseInt(matchColon[1], 10);
                foundMinute = parseInt(matchColon[2], 10);
            } else if (matchUhrMinute) {
                foundHour = parseInt(matchUhrMinute[1], 10);
                foundMinute = parseInt(matchUhrMinute[2], 10);
            } else if (matchUhrSimple) {
                foundHour = parseInt(matchUhrSimple[1], 10);
                foundMinute = 0;
            }

            if (foundHour !== null && foundHour >= 0 && foundHour <= 23) {
                targetDate.setHours(foundHour, foundMinute, 0, 0);
            } else if (parsedIso) {
                let dTest = new Date(parsedIso);
                if (!isNaN(dTest.getTime())) {
                    targetDate.setHours(dTest.getHours(), dTest.getMinutes(), 0, 0);
                }
            }

            return targetDate;
        }

        function processTextCommand(text) {
            const isEvent = !text.toLowerCase().includes("reminder") && !text.toLowerCase().includes("notiz");
            
            // Datum sauber ermitteln
            let targetDate = parseTargetDate(text, null);

            // Minuten bis zum Termin berechnen
            const now = new Date();
            const diffMinutes = Math.floor((targetDate - now) / (1000 * 60));

            // Standard-Vorwarnzeiten
            let reminderMinutes = 120; // 2 Stunden für To-Dos/Reminders
            if (isEvent) {
                reminderMinutes = 240; // 4 Stunden für echte Termine
            }

            // Kurzfrist-Erkennung: Wenn der Termin in weniger als 2,5 Stunden ansteht
            if (diffMinutes < 150) { 
                reminderMinutes = 15; // Automatisch auf 15 Minuten vorziehen
            }

            output.textContent += `\n-> Geplant für: ${targetDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
            output.textContent += `\n-> Erinnerung aktiv: ${reminderMinutes} Minuten vorher.`;
            
            // Hier greift dann die Weiterleitung an deine Google Calendar API / Vercel Backend
        }
    </script>
</body>
</html>
