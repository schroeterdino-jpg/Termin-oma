<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerminApp für Oma</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        button {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            width: 100%;
            transition: background-color 0.3s;
        }
        button:active {
            background-color: #3367D6;
        }
        button.recording {
            background-color: #EA4335;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 67, 53, 0.4); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(234, 67, 53, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 67, 53, 0); }
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #555;
            word-break: break-word;
        }
        #eventList {
            margin-top: 25px;
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        #eventList h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #444;
        }
        .event-item {
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
            border-left: 4px solid #4285F4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Termin per Spracheingabe</h1>
        <p>Drücke den Knopf und sage z.B.:<br><em>"Zahnarzt heute um 16 Uhr"</em></p>
        
        <button id="micBtn" onclick="startSpeechRecognition()">🎤 Sprechen</button>
        
        <div id="status">Bereit...</div>

        <div id="eventList">
            <h3>Eingetragene Termine:</h3>
            <div id="eventsContainer">Lade Termine aus dem Kalender...</div>
        </div>
    </div>

    <!-- Google GIS (Google Identity Services) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        const CLIENT_ID = '399573320370-qka01ghj0s88eoair7lla665cbj10o4g.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/calendar.events';
        
        let tokenClient;
        let accessToken = null;

        window.onload = function () {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (response) => {
                    if (response.error !== undefined) {
                        document.getElementById('status').innerText = 'Fehler bei der Anmeldung: ' + response.error;
                        return;
                    }
                    accessToken = response.access_token;
                    document.getElementById('status').innerText = 'Angemeldet! Lade Termine...';
                    fetchUpcomingEvents();
                },
            });
            tokenClient.requestAccessToken({ prompt: '' });
        };

        function startSpeechRecognition() {
            if (!accessToken) {
                tokenClient.requestAccessToken({ prompt: '' });
            } else {
                listenAndProcess();
            }
        }

        function fetchUpcomingEvents() {
            if (!accessToken) return;

            const now = new Date().toISOString();
            fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${now}&maxResults=30&singleEvents=true&orderBy=startTime`, {
                headers: {
                    'Authorization': 'Bearer ' + accessToken
                }
            })
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('eventsContainer');
                container.innerHTML = '';

                if (!data.items || data.items.length === 0) {
                    container.innerHTML = 'Keine anstehenden Termine gefunden.';
                    document.getElementById('status').innerText = 'Bereit...';
                    return;
                }

                // Nur Termine mit echter Uhrzeit anzeigen (ganztägige Geburtstage etc. ausblenden)
                const timedEvents = data.items.filter(item => item.start.dateTime);

                if (timedEvents.length === 0) {
                    container.innerHTML = 'Keine anstehenden Uhrzeit-Termine gefunden.';
                    document.getElementById('status').innerText = 'Bereit...';
                    return;
                }

                timedEvents.slice(0, 5).forEach((item, index) => {
                    const startDate = new Date(item.start.dateTime);
                    const formattedDate = startDate.toLocaleDateString('de-DE', {weekday: 'short', day: '2-digit', month: '2-digit'});
                    const formattedTime = startDate.toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'}) + ' Uhr';
                    
                    const div = document.createElement('div');
                    div.className = 'event-item';
                    div.innerText = `${index + 1}. ${item.summary} (${formattedDate}, ${formattedTime})`;
                    container.appendChild(div);
                });
                document.getElementById('status').innerText = 'Bereit...';
            })
            .catch(err => {
                console.error(err);
                document.getElementById('eventsContainer').innerHTML = 'Fehler beim Laden der Termine.';
                document.getElementById('status').innerText = 'Bereit...';
            });
        }

        function listenAndProcess() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Spracherkennung wird von diesem Browser leider nicht unterstützt.');
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            
            const btn = document.getElementById('micBtn');

            recognition.onstart = function() {
                btn.classList.add('recording');
                btn.innerText = '🔴 Höre zu...';
                document.getElementById('status').innerText = '🎙️ Bitte sprich jetzt...';
            };

            recognition.onresult = function(event) {
                const speechText = event.results[0][0].transcript;
                document.getElementById('status').innerText = 'Erkannt: "' + speechText + '" - Sende an Kalender...';
                parseAndCreateEvent(speechText);
            };

            recognition.onerror = function(event) {
                document.getElementById('status').innerText = 'Sprachfehler: ' + event.error;
                resetButton();
            };

            recognition.onend = function() {
                resetButton();
            };

            recognition.start();
        }

        function resetButton() {
            const btn = document.getElementById('micBtn');
            btn.classList.remove('recording');
            btn.innerText = '🎤 Sprechen';
        }

        function parseAndCreateEvent(text) {
            let eventDate = new Date();
            let hours = 10; 
            let minutes = 0;

            const lowerText = text.toLowerCase();

            if (lowerText.includes('morgen')) {
                eventDate.setDate(eventDate.getDate() + 1);
            }

            const timeMatch = text.match(/(?:um\s+)?(\d{1,2})(?::(\d{2}))?\s*uhr/i);
            if (timeMatch) {
                hours = parseInt(timeMatch[1], 10);
                if (timeMatch[2]) {
                    minutes = parseInt(timeMatch[2], 10);
                }
            } else {
                const altMatch = text.match(/(\d{1,2}):(\d{2})/);
                if (altMatch) {
                    hours = parseInt(altMatch[1], 10);
                    minutes = parseInt(altMatch[2], 10);
                }
            }

            let eventTitle = text
                .replace(/heute|morgen/gi, '')
                .replace(/(?:um\s+)?\d{1,2}(?::\d{2})?\s*uhr/gi, '')
                .replace(/erinnere mich.*$/i, '')
                .replace(/sag mir.*$/i, '')
                .replace(/\d+\s*(?:stunden?|minuten?).*$/i, '')
                .trim();

            if (!eventTitle) {
                eventTitle = "Termin";
            }

            eventDate.setHours(hours, minutes, 0, 0);
            let endDate = new Date(eventDate.getTime() + 60 * 60 * 1000);

            function toLocalISOString(date) {
                const pad = (n) => String(n).padStart(2, '0');
                const yyyy = date.getFullYear();
                const MM = pad(date.getMonth() + 1);
                const dd = pad(date.getDate());
                const hh = pad(date.getHours());
                const mm = pad(date.getMinutes());
                const ss = pad(date.getSeconds());
                
                const offsetMinutes = -date.getTimezoneOffset();
                const sign = offsetMinutes >= 0 ? '+' : '-';
                const absOffsetHours = pad(Math.floor(Math.abs(offsetMinutes) / 60));
                const absOffsetMins = pad(Math.abs(offsetMinutes) % 60);

                return `${yyyy}-${MM}-${dd}T${hh}:${mm}:${ss}${sign}${absOffsetHours}:${absOffsetMins}`;
            }

            const calendarEvent = {
                'summary': eventTitle,
                'description': 'Erstellt über Omas Sprach-App',
                'start': {
                    'dateTime': toLocalISOString(eventDate)
                },
                'end': {
                    'dateTime': toLocalISOString(endDate)
                }
            };

            fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + accessToken,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(calendarEvent)
            })
            .then(async response => {
                if (response.ok) {
                    document.getElementById('status').innerText = '✅ Termin erfolgreich eingetragen!';
                    fetchUpcomingEvents();
                } else {
                    const errData = await response.json();
                    console.error(errData);
                    document.getElementById('status').innerText = '❌ Fehler: ' + (errData.error?.message || response.statusText);
                }
            })
            .catch(error => {
                document.getElementById('status').innerText = '❌ Netzwerkfehler: ' + error.message;
            });
        }
    </script>
</body>
</html>
