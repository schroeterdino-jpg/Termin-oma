<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerminApp für Oma</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        button {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            width: 100%;
            transition: background-color 0.3s;
        }
        button:active {
            background-color: #3367D6;
        }
        button.recording {
            background-color: #EA4335;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 67, 53, 0.4); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(234, 67, 53, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 67, 53, 0); }
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #555;
        }
        #eventList {
            margin-top: 25px;
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        #eventList h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #444;
        }
        .event-item {
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
            border-left: 4px solid #4285F4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Termin per Spracheingabe</h1>
        <p>Drücke den Knopf und sage z.B.:<br><em>"Arzttermin morgen um 10 Uhr"</em></p>
        
        <button id="micBtn" onclick="startSpeechRecognition()">🎤 Sprechen</button>
        
        <div id="status">Bereit...</div>

        <div id="eventList">
            <h3>Eingetragene Termine:</h3>
            <div id="eventsContainer">Noch keine Termine in dieser Sitzung.</div>
        </div>
    </div>

    <!-- Google GIS (Google Identity Services) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        const CLIENT_ID = '399573320370-qka01ghj0s88eoair7lla665cbj10o4g.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/calendar.events';
        
        let tokenClient;
        let accessToken = null;
        let createdEvents = [];

        window.onload = function () {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (response) => {
                    if (response.error !== undefined) {
                        document.getElementById('status').innerText = 'Fehler bei der Anmeldung.';
                        return;
                    }
                    accessToken = response.access_token;
                    document.getElementById('status').innerText = 'Angemeldet! Du kannst sprechen.';
                    listenAndProcess();
                },
            });
        };

        function startSpeechRecognition() {
            if (!accessToken) {
                tokenClient.requestAccessToken({ prompt: 'consent' });
            } else {
                listenAndProcess();
            }
        }

        function listenAndProcess() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Spracherkennung wird von diesem Browser leider nicht unterstützt.');
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            
            const btn = document.getElementById('micBtn');

            recognition.onstart = function() {
                btn.classList.add('recording');
                btn.innerText = '🔴 Höre zu...';
                document.getElementById('status').innerText = '🎙️ Bitte sprich jetzt...';
            };

            recognition.onresult = function(event) {
                const speechText = event.results[0][0].transcript;
                document.getElementById('status').innerText = 'Erkannt: "' + speechText + '" - Erstelle Termin...';
                createCalendarEvent(speechText);
            };

            recognition.onerror = function(event) {
                document.getElementById('status').innerText = 'Fehler bei der Spracherkennung: ' + event.error;
                resetButton();
            };

            recognition.onend = function() {
                resetButton();
            };

            recognition.start();
        }

        function resetButton() {
            const btn = document.getElementById('micBtn');
            btn.classList.remove('recording');
            btn.innerText = '🎤 Sprechen';
        }

        function createCalendarEvent(text) {
            const event = {
                'summary': text,
                'description': 'Erstellt über Sprach-App',
                'start': {
                    'dateTime': new Date(Date.now() + 86400000).toISOString()
                },
                'end': {
                    'dateTime': new Date(Date.now() + 90000000).toISOString()
                }
            };

            fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + accessToken,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(event)
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('status').innerText = '✅ Termin erfolgreich eingetragen!';
                    addEventToList(text);
                } else {
                    document.getElementById('status').innerText = '❌ Fehler beim Speichern im Kalender.';
                }
            })
            .catch(error => {
                document.getElementById('status').innerText = '❌ Netzwerkfehler.';
            });
        }

        function addEventToList(text) {
            createdEvents.push(text);
            const container = document.getElementById('eventsContainer');
            container.innerHTML = '';
            createdEvents.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'event-item';
                div.innerText = `${index + 1}. ${item}`;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
