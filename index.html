<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omas Sprach-Assistent</title>
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/7856/7856387.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/7856/7856387.png">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Oma Assistent">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            color: #222;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .header-title-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 3px 8px rgba(13, 110, 253, 0.3);
        }
        h1 {
            font-size: 20px;
            margin: 0;
            color: #111;
        }
        .close-app-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 14px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        .login-btn {
            background-color: #fbbc05;
            color: #111;
            font-weight: bold;
            font-size: 16px;
            padding: 14px;
            margin-bottom: 15px;
            width: 100%;
            border-radius: 12px;
            border: none;
            cursor: pointer;
        }
        .tab-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            background: #e4e6eb;
            padding: 5px;
            border-radius: 14px;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 6px;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
        }
        .tab-btn.active {
            background: #fff;
            color: #0d6efd;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .big-btn {
            width: 100%;
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 22px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .big-btn.todo-btn {
            background-color: #198754;
            box-shadow: 0 4px 10px rgba(25, 135, 84, 0.3);
        }
        .big-btn.recording {
            background-color: #dc3545 !important;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.5); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 12px rgba(220, 53, 69, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
        #status {
            margin: 15px 0;
            font-weight: bold;
            color: #333;
            font-size: 16px;
            background: #f8f9fa;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            border-left: 5px solid #0d6efd;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #222;
            margin-bottom: 12px;
        }
        .action-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .action-sub-btn {
            flex: 1;
            background: #e9ecef;
            color: #222;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }
        .event-item {
            background: #f8f9fa;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 16px;
            border-left: 6px solid #0d6efd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .event-delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 10px;
            width: 44px;
            height: 44px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
        }
        .todo-item {
            background: #f1f8f5;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 16px;
            border-left: 6px solid #198754;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .todo-item.completed span {
            text-decoration: line-through;
            color: #888;
        }
        .todo-item.completed {
            background: #f8f9fa;
            border-left-color: #ccc;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #dc3545;
            font-size: 22px;
            cursor: pointer;
            padding: 0 5px;
            flex: none;
        }
        .call-btn {
            width: 100%;
            background-color: #198754;
            color: white;
            border: none;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(25, 135, 84, 0.3);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            box-sizing: border-box;
        }
        .contact-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }
        .contact-card label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .contact-input {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .save-contact-btn {
            width: 100%;
            background: #0d6efd;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .hint-box {
            font-size: 13px;
            color: #666;
            text-align: center;
            margin-top: 15px;
            background: #fff3cd;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="app-header">
            <div class="header-title-area">
                <div class="app-logo">🎙️</div>
                <h1>Omas Sprach-Assistent</h1>
            </div>
            <button id="closeAppBtn" class="close-app-btn">❌ Beenden</button>
        </div>
        
        <button id="loginBtn" class="login-btn" style="display:none;">🔐 Bei Google anmelden</button>

        <div class="tab-bar">
            <button id="tabSpeakBtn" class="tab-btn active">🎤 Sprechen</button>
            <button id="tabCalendarBtn" class="tab-btn">📅 Termine</button>
            <button id="tabContactsBtn" class="tab-btn">📞 Anrufen</button>
        </div>

        <!-- REITER 1 -->
        <div id="tab-speak" class="tab-content active">
            <div style="font-size: 15px; color: #555; margin-bottom: 15px; text-align: center; font-weight: bold;">
                Wähle aus, was du sagen möchtest:
            </div>

            <button id="micEventBtn" class="big-btn">
                🎤 Neuen Termin sprechen
            </button>
            
            <button id="micTodoBtn" class="big-btn todo-btn">
                🗣️ Notiz / To-Do sprechen
            </button>
            
            <div id="status">Initialisiere App...</div>

            <div class="hint-box">
                💡 Tipp: Sag z.B. <i>"Arzttermin morgen um 14 Uhr"</i>.
            </div>
        </div>

        <!-- REITER 2 -->
        <div id="tab-calendar" class="tab-content">
            <div class="section-title">Anstehende Termine</div>
            
            <div class="action-row">
                <button id="speakSummaryBtn" class="action-sub-btn" style="background: #cfe2ff; color: #084298;">🔊 Vorlesen</button>
                <button id="refreshEventsBtn" class="action-sub-btn">🔄 Neu laden</button>
            </div>

            <div id="deleteEventsContainer" style="margin-top: 10px;">Lade Termine...</div>

            <div style="margin-top: 25px;">
                <div class="section-title">
                    <span>Merkliste / To-Dos</span>
                    <span style="font-size: 13px; font-weight: normal; color: #666;">(Klick = Abhaken)</span>
                </div>
                <div id="todosContainer">Noch keine Notizen.</div>
            </div>
        </div>

        <!-- REITER 3 -->
        <div id="tab-contacts" class="tab-content">
            <div class="section-title">Schnellwahl</div>
            <div style="font-size: 14px; color: #555; margin-bottom: 15px;">
                Ein Klick startet sofort den Anruf:
            </div>

            <div id="quickCallContainer"></div>

            <hr style="border: none; border-top: 1px solid #ddd; margin: 20px 0;">

            <div class="section-title" style="font-size: 16px;">Nummern bearbeiten</div>

            <div class="contact-card">
                <label>Kontakt 1 (z.B. Simone)</label>
                <input type="text" id="c1Name" class="contact-input" placeholder="Name">
                <input type="tel" id="c1Phone" class="contact-input" placeholder="Telefonnummer">
                <button id="saveC1Btn" class="save-contact-btn">Speichern</button>
            </div>

            <div class="contact-card">
                <label>Kontakt 2</label>
                <input type="text" id="c2Name" class="contact-input" placeholder="Name">
                <input type="tel" id="c2Phone" class="contact-input" placeholder="Telefonnummer">
                <button id="saveC2Btn" class="save-contact-btn">Speichern</button>
            </div>

            <div class="contact-card">
                <label>Kontakt 3</label>
                <input type="text" id="c3Name" class="contact-input" placeholder="Name">
                <input type="tel" id="c3Phone" class="contact-input" placeholder="Telefonnummer">
                <button id="saveC3Btn" class="save-contact-btn">Speichern</button>
            </div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        const CLIENT_ID = '399573320370-qka01ghj0s88eoair7lla665cbj10o4g.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/calendar.events';
        
        let tokenClient;
        let accessToken = null;
        let todos = JSON.parse(localStorage.getItem('omas_todos') || '[]');
        let latestEventsSpeechText = "Es sind keine anstehenden Termine geladen.";
        let rawEventsList = [];

        let contacts = JSON.parse(localStorage.getItem('omas_contacts') || JSON.stringify([
            { name: "Simone", phone: "" },
            { name: "Kontakt 2", phone: "" },
            { name: "Kontakt 3", phone: "" }
        ]));

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
            attachEventListeners();
        });

        function attachEventListeners() {
            document.getElementById('closeAppBtn').addEventListener('click', exitApp);
            document.getElementById('loginBtn').addEventListener('click', triggerLogin);

            document.getElementById('tabSpeakBtn').addEventListener('click', (e) => switchTab('speak', e));
            document.getElementById('tabCalendarBtn').addEventListener('click', (e) => switchTab('calendar', e));
            document.getElementById('tabContactsBtn').addEventListener('click', (e) => switchTab('contacts', e));

            document.getElementById('micEventBtn').addEventListener('click', () => startSpeechRecognition('event'));
            document.getElementById('micTodoBtn').addEventListener('click', () => startSpeechRecognition('todo'));
            document.getElementById('speakSummaryBtn').addEventListener('click', speakSummary);
            document.getElementById('refreshEventsBtn').addEventListener('click', fetchUpcomingEvents);

            document.getElementById('saveC1Btn').addEventListener('click', () => saveContact(1));
            document.getElementById('saveC2Btn').addEventListener('click', () => saveContact(2));
            document.getElementById('saveC3Btn').addEventListener('click', () => saveContact(3));
        }

        function initApp() {
            if (typeof google !== 'undefined' && google.accounts) {
                setupGoogleClient();
            } else {
                setTimeout(setupGoogleClient, 1000);
            }
            renderTodos();
            loadContactsUI();
        }

        function setupGoogleClient() {
            try {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: SCOPES,
                    callback: (response) => {
                        if (response.error !== undefined) {
                            document.getElementById('status').innerText = 'Bitte einmal bei Google anmelden.';
                            document.getElementById('loginBtn').style.display = 'block';
                            return;
                        }
                        accessToken = response.access_token;
                        document.getElementById('loginBtn').style.display = 'none';
                        document.getElementById('status').innerText = 'Bereit zum Sprechen...';
                        fetchUpcomingEvents();
                    },
                });

                tokenClient.requestAccessToken({ prompt: '' });
            } catch (e) {
                document.getElementById('loginBtn').style.display = 'block';
                document.getElementById('status').innerText = 'Bitte bei Google anmelden.';
            }
        }

        function switchTab(tabName, event) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            if (tabName === 'speak') {
                document.getElementById('tab-speak').classList.add('active');
            } else if (tabName === 'calendar') {
                document.getElementById('tab-calendar').classList.add('active');
                fetchUpcomingEvents();
            } else if (tabName === 'contacts') {
                document.getElementById('tab-contacts').classList.add('active');
                loadContactsUI();
            }
            event.currentTarget.classList.add('active');
        }

        function exitApp() {
            window.close();
            setTimeout(() => {
                window.location.href = "about:blank";
            }, 100);
        }

        function triggerLogin() {
            if (tokenClient) {
                tokenClient.requestAccessToken({ prompt: 'consent' });
            }
        }

        function loadContactsUI() {
            for (let i = 0; i < 3; i++) {
                document.getElementById(`c${i+1}Name`).value = contacts[i].name || '';
                document.getElementById(`c${i+1}Phone`).value = contacts[i].phone || '';
            }

            const container = document.getElementById('quickCallContainer');
            container.innerHTML = '';

            contacts.forEach((c) => {
                const a = document.createElement('a');
                a.className = 'call-btn';
                
                if (c.phone) {
                    a.href = `tel:${c.phone}`;
                    a.innerHTML = `📞 ${c.name} anrufen`;
                    a.style.backgroundColor = '#198754';
                } else {
                    a.href = '#';
                    a.onclick = (e) => {
                        e.preventDefault();
                        alert(`Bitte erst unten die Nummer für "${c.name}" speichern!`);
                    };
                    a.innerHTML = `⚠️ ${c.name} (Nummer fehlt)`;
                    a.style.backgroundColor = '#6c757d';
                }
                container.appendChild(a);
            });
        }

        function saveContact(num) {
            const name = document.getElementById(`c${num}Name`).value.trim();
            const phone = document.getElementById(`c${num}Phone`).value.trim();

            contacts[num-1] = { name: name || `Kontakt ${num}`, phone: phone };
            localStorage.setItem('omas_contacts', JSON.stringify(contacts));
            
            loadContactsUI();
            alert(`Kontakt "${contacts[num-1].name}" gespeichert!`);
        }

        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("Audio Context blockiert", e);
            }
        }

        function speakSummary() {
            if (!('speechSynthesis' in window)) {
                alert('Dein Browser unterstützt keine Sprachausgabe.');
                return;
            }

            window.speechSynthesis.cancel();
            let speechText = latestEventsSpeechText;
            
            const activeTodos = todos.filter(t => !t.completed);
            if (activeTodos.length > 0) {
                speechText += " Ausserdem hast du noch folgende Notizen: ";
                // Hier wurde die Nummerierung (i + 1) entfernt, damit kein "erste" vorgelesen wird:
                activeTodos.forEach((t) => {
                    speechText += t.text + ". ";
                });
            }

            const utterance = new SpeechSynthesisUtterance(speechText);
            utterance.lang = 'de-DE';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function startSpeechRecognition(mode) {
            if (mode === 'event' && !accessToken) {
                alert('Bitte zuerst bei Google anmelden!');
                triggerLogin();
                return;
            }
            listenAndProcess(mode);
        }

        function fetchUpcomingEvents() {
            if (!accessToken) {
                document.getElementById('deleteEventsContainer').innerHTML = 'Nicht angemeldet.';
                document.getElementById('loginBtn').style.display = 'block';
                return;
            }

            const now = new Date().toISOString();
            fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${now}&maxResults=30&singleEvents=true&orderBy=startTime`, {
                headers: {
                    'Authorization': 'Bearer ' + accessToken
                }
            })
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('deleteEventsContainer');
                container.innerHTML = '';

                if (!data.items || data.items.length === 0) {
                    container.innerHTML = '<div style="font-size: 15px; color: #666; padding: 10px; text-align: center;">Keine anstehenden Termine gefunden.</div>';
                    latestEventsSpeechText = "Es sind keine anstehenden Termine im Kalender.";
                    return;
                }

                const timedEvents = data.items.filter(item => item.start && item.start.dateTime);
                rawEventsList = timedEvents;

                if (timedEvents.length === 0) {
                    container.innerHTML = '<div style="font-size: 15px; color: #666; padding: 10px; text-align: center;">Keine anstehenden Uhrzeit-Termine gefunden.</div>';
                    latestEventsSpeechText = "Keine anstehenden Uhrzeit-Termine gefunden.";
                    return;
                }

                let speechParts = [];
                const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];

                timedEvents.slice(0, 10).forEach((item) => {
                    const startDate = new Date(item.start.dateTime);
                    const dayNum = startDate.getDate();
                    const monthName = monthNames[startDate.getMonth()];
                    const hours = startDate.getHours();
                    const minutes = startDate.getMinutes();

                    const formattedDate = startDate.toLocaleDateString('de-DE', {weekday: 'short', day: '2-digit', month: '2-digit'});
                    const formattedTime = startDate.toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'}) + ' Uhr';
                    
                    let timeString = minutes === 0 ? `${hours} Uhr` : `${hours} Uhr ${minutes}`;
                    speechParts.push(`${item.summary}, am ${dayNum}. ${monthName} um ${timeString}`);

                    const div = document.createElement('div');
                    div.className = 'event-item';

                    const span = document.createElement('span');
                    span.innerHTML = `<strong>${item.summary}</strong><br><span style="color:#555; font-size:14px;">📅 ${formattedDate}, ${formattedTime}</span>`;

                    const delBtn = document.createElement('button');
                    delBtn.className = 'event-delete-btn';
                    delBtn.innerHTML = '🗑️';
                    delBtn.title = 'Termin löschen';
                    delBtn.addEventListener('click', () => deleteCalendarEvent(item.id, item.summary));

                    div.appendChild(span);
                    div.appendChild(delBtn);
                    container.appendChild(div);
                });

                latestEventsSpeechText = "Deine nächsten Termine sind: " + speechParts.join(". ");
            })
            .catch(err => {
                console.error(err);
                document.getElementById('deleteEventsContainer').innerHTML = 'Fehler beim Laden der Termine.';
            });
        }

        function deleteCalendarEvent(eventId, eventTitle) {
            if (!confirm(`Möchtest du den Termin "${eventTitle}" wirklich löschen?`)) {
                return;
            }

            document.getElementById('status').innerText = `Lösche "${eventTitle}"...`;

            fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer ' + accessToken
                }
            })
            .then(response => {
                if (response.ok || response.status === 204) {
                    document.getElementById('status').innerText = `✅ "${eventTitle}" gelöscht!`;
                    fetchUpcomingEvents();
                } else {
                    document.getElementById('status').innerText = '❌ Fehler beim Löschen.';
                }
            })
            .catch(error => {
                console.error(error);
                document.getElementById('status').innerText = '❌ Netzwerkfehler.';
            });
        }

        function listenAndProcess(mode) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Spracherkennung wird von diesem Browser leider nicht unterstützt.');
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            
            const btn = mode === 'event' ? document.getElementById('micEventBtn') : document.getElementById('micTodoBtn');

            recognition.onstart = function() {
                playBeep();
                btn.classList.add('recording');
                btn.innerHTML = '🔴 Bitte sprechen...';
                document.getElementById('status').innerText = '🎙️ Höre zu...';
            };

            recognition.onresult = function(event) {
                const speechText = event.results[0][0].transcript;
                
                if (mode === 'event') {
                    document.getElementById('status').innerText = 'Erkannt: "' + speechText + '" - Trage ein...';
                    parseAndCreateEvent(speechText);
                } else {
                    document.getElementById('status').innerText = 'Notiz hinzugefügt: "' + speechText + '"';
                    addTodo(speechText);
                }
            };

            recognition.onerror = function(event) {
                document.getElementById('status').innerText = 'Sprachfehler: ' + event.error;
                resetButtons();
            };

            recognition.onend = function() {
                resetButtons();
            };

            recognition.start();
        }

        function resetButtons() {
            const btnEvent = document.getElementById('micEventBtn');
            const btnTodo = document.getElementById('micTodoBtn');
            btnEvent.classList.remove('recording');
            btnEvent.innerHTML = '🎤 Neuen Termin sprechen';
            btnTodo.classList.remove('recording');
            btnTodo.innerHTML = '🗣️ Notiz / To-Do sprechen';
        }

        function addTodo(text) {
            todos.unshift({ text: text, completed: false });
            saveAndRenderTodos();
        }

        function toggleTodo(index) {
            todos[index].completed = !todos[index].completed;
            saveAndRenderTodos();
        }

        function deleteTodo(event, index) {
            event.stopPropagation();
            todos.splice(index, 1);
            saveAndRenderTodos();
        }

        function saveAndRenderTodos() {
            localStorage.setItem('omas_todos', JSON.stringify(todos));
            renderTodos();
        }

        function renderTodos() {
            const container = document.getElementById('todosContainer');
            container.innerHTML = '';

            if (todos.length === 0) {
                container.innerHTML = '<div style="color: #666; font-size: 15px; text-align: center; padding: 10px;">Noch keine Notizen vorhanden.</div>';
                return;
            }

            todos.forEach((todo, index) => {
                const div = document.createElement('div');
                div.className = 'todo-item' + (todo.completed ? ' completed' : '');
                
                const span = document.createElement('span');
                span.innerText = todo.text;
                
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '🗑️';
                delBtn.addEventListener('click', (e) => deleteTodo(e, index));

                div.appendChild(span);
                div.appendChild(delBtn);
                div.addEventListener('click', () => toggleTodo(index));

                container.appendChild(div);
            });
        }

        function parseAndCreateEvent(text) {
            let eventDate = new Date();
            let hours = 10; 
            let minutes = 0;

            const lowerText = text.toLowerCase();

            if (lowerText.includes('morgen')) {
                eventDate.setDate(eventDate.getDate() + 1);
            }

            const timeMatch = text.match(/(?:um\s+)?(\d{1,2})(?::(\d{2}))?\s*uhr/i);
            if (timeMatch) {
                hours = parseInt(timeMatch[1], 10);
                if (timeMatch[2]) {
                    minutes = parseInt(timeMatch[2], 10);
                }
            } else {
                const altMatch = text.match(/(\d{1,2}):(\d{2})/);
                if (altMatch) {
                    hours = parseInt(altMatch[1], 10);
                    minutes = parseInt(altMatch[2], 10);
                }
            }

            let eventTitle = text
                .replace(/heute|morgen/gi, '')
                .replace(/(?:um\s+)?\d{1,2}(?::\d{2})?\s*uhr/gi, '')
                .replace(/erinnere mich.*$/i, '')
                .replace(/sag mir.*$/i, '')
                .replace(/\d+\s*(?:stunden?|minuten?).*$/i, '')
                .trim();

            if (!eventTitle) {
                eventTitle = "Termin";
            }

            eventDate.setHours(hours, minutes, 0, 0);
            let endDate = new Date(eventDate.getTime() + 60 * 60 * 1000);

            function toLocalISOString(date) {
                const pad = (n) => String(n).padStart(2, '0');
                const yyyy = date.getFullYear();
                const MM = pad(date.getMonth() + 1);
                const dd = pad(date.getDate());
                const hh = pad(date.getHours());
                const mm = pad(date.getMinutes());
                const ss = pad(date.getSeconds());
                
                let offsetMinutes = -date.getTimezoneOffset();
                let sign = offsetMinutes >= 0 ? '+' : '-';
                let absOffsetHours = pad(Math.floor(Math.abs(offsetMinutes) / 60));
                let absOffsetMins = pad(Math.abs(offsetMinutes) % 60);

                return `${yyyy}-${MM}-${dd}T${hh}:${mm}:${ss}${sign}${absOffsetHours}:${absOffsetMins}`;
            }

            const calendarEvent = {
                'summary': eventTitle,
                'description': 'Erstellt über Omas Sprach-Assistent',
                'start': {
                    'dateTime': toLocalISOString(eventDate)
                },
                'end': {
                    'dateTime': toLocalISOString(endDate)
                }
            };

            fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + accessToken,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(calendarEvent)
            })
            .then(async response => {
                if (response.ok) {
                    document.getElementById('status').innerText = `✅ "${eventTitle}" eingetragen!`;
                    fetchUpcomingEvents();
                } else {
                    const errData = await response.json();
                    console.error(errData);
                    document.getElementById('status').innerText = '❌ Fehler beim Eintragen.';
                }
            })
            .catch(() => {
                document.getElementById('status').innerText = '❌ Netzwerkfehler.';
            });
        }
    </script>
</body>
